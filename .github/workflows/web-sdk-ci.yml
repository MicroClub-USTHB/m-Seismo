name: Web SDK CI

on:
  push:
    branches: [main, master]
    paths:
      - 'sdks/web/**'
      - '.github/workflows/web-sdk-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'sdks/web/**'
      - '.github/workflows/web-sdk-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
