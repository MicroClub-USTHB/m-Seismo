name: Android SDK CI

on:
  push:
    branches: [main]
    paths: ["sdks/android/**", "spec/**"]
  pull_request:
    paths: ["sdks/android/**", "spec/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :mseismo:testDebugUnitTest

      - name: Build SDK (AAR)
        run: ./gradlew :mseismo:assembleRelease

      - name: Build example app
        run: ./gradlew :example:assembleDebug
