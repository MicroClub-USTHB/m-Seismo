name: iOS SDK CI

on:
  push:
    branches: [main]
    paths: ["sdks/ios/**"]
  pull_request:
    paths: ["sdks/ios/**"]

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sdks/ios
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: swift build

      - name: Test package (macOS host)
        run: swift test

      - name: Test package (iOS Simulator)
        # swift test above only runs on the macOS host, which silently
        # skips everything behind #if os(iOS) -- most of this package.
        # xcodebuild can test the same SPM target against a real iOS
        # Simulator destination; that's the one that actually covers it.
        run: |
          xcodebuild test \
            -scheme MSeismo \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate example app project
        working-directory: sdks/ios/Example
        run: xcodegen generate

      - name: Build example app
        working-directory: sdks/ios/Example
        run: |
          xcodebuild \
            -project ExampleApp.xcodeproj \
            -scheme ExampleApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build
