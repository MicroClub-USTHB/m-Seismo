name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/web/package-lock.json

      - name: Install dependencies
        working-directory: sdks/web
        run: npm ci

      - name: Typecheck
        working-directory: sdks/web
        run: npm run typecheck

      - name: Unit tests
        working-directory: sdks/web
        run: npm test

      - name: Build
        working-directory: sdks/web
        run: npm run build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/web/package-lock.json

      - name: Install dependencies
        working-directory: sdks/web
        run: npm ci

      - name: Get Playwright version
        working-directory: sdks/web
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser
        working-directory: sdks/web
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        working-directory: sdks/web
        run: CI=true npx playwright test --project=${{ matrix.browser }}
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: sdks/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        run: |
          if [ -d sdks/web/test-results ]; then
            echo "traces exist"
          fi
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: sdks/web/test-results/
          retention-days: 7
