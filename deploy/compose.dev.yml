# Local development stack for the m-Seismo backend.
#
#   docker compose -f deploy/compose.dev.yml up --build -d
#   curl http://localhost:8080/healthz
#
# Services: Postgres, Redis, NATS (JetStream), a one-shot dbmate migration,
# and the backend. Configure a real GitHub App, GitLab application and/or
# Bitbucket consumer via the SEISMO_GITHUB_*, SEISMO_GITLAB_* and
# SEISMO_BITBUCKET_* variables in deploy/.env (see deploy/.env.example).

name: m-seismo-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seismo
      POSTGRES_PASSWORD: seismo
      POSTGRES_DB: seismo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seismo -d seismo"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://seismo:seismo@postgres:5432/seismo?sslmode=disable
    command: ["--wait", "--no-dump-schema", "--migrations-dir", "/db/migrations", "up"]
    volumes:
      - ../backend/db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
      target: backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      # Coordinator.Attach (plain gRPC in development)
      - "${COORDINATOR_PORT:-9443}:9443"
    environment:
      SEISMO_CRASH_PROVIDERS_ENCRYPTION_KEY: ${SEISMO_CRASH_PROVIDERS_ENCRYPTION_KEY:-}
      SEISMO_CRASH_PROVIDERS_PREVIOUS_ENCRYPTION_KEYS: ${SEISMO_CRASH_PROVIDERS_PREVIOUS_ENCRYPTION_KEYS:-}
      SEISMO_CRASH_PROVIDERS_SENTRY_ORIGINS: ${SEISMO_CRASH_PROVIDERS_SENTRY_ORIGINS:-https://sentry.io https://us.sentry.io https://de.sentry.io}
      SEISMO_ENV: development
      SEISMO_LOG_LEVEL: debug
      SEISMO_SERVER_HOST: 0.0.0.0
      SEISMO_SERVER_PORT: "8080"
      SEISMO_SERVER_PUBLIC_URL: http://localhost:${BACKEND_PORT:-8080}
      SEISMO_SERVER_FRONTEND_URL: ${SEISMO_SERVER_FRONTEND_URL:-http://localhost:3000}
      SEISMO_DATABASE_URL: postgres://seismo:seismo@postgres:5432/seismo?sslmode=disable
      SEISMO_REDIS_URL: redis://redis:6379/0
      SEISMO_NATS_URL: nats://nats:4222
      SEISMO_AUTH_JWT_SECRET: ${SEISMO_AUTH_JWT_SECRET:-}
      SEISMO_AUTH_JWT_TTL: ${SEISMO_AUTH_JWT_TTL:-24h}
      # GitHub App: set these in deploy/.env (see deploy/.env.example).
      SEISMO_GITHUB_APP_ID: ${SEISMO_GITHUB_APP_ID:-}
      SEISMO_GITHUB_APP_SLUG: ${SEISMO_GITHUB_APP_SLUG:-}
      SEISMO_GITHUB_CLIENT_ID: ${SEISMO_GITHUB_CLIENT_ID:-}
      SEISMO_GITHUB_CLIENT_SECRET: ${SEISMO_GITHUB_CLIENT_SECRET:-}
      SEISMO_GITHUB_PRIVATE_KEY: ${SEISMO_GITHUB_PRIVATE_KEY:-}
      SEISMO_GITHUB_PRIVATE_KEY_PATH: ${SEISMO_GITHUB_PRIVATE_KEY_PATH:-}
      SEISMO_GITHUB_API_URL: ${SEISMO_GITHUB_API_URL:-}
      SEISMO_GITHUB_WEB_URL: ${SEISMO_GITHUB_WEB_URL:-}
      # GitHub rate-limit handling (see backend/docs/github.md#rate-limits)
      SEISMO_GITHUB_MIN_WRITE_INTERVAL: ${SEISMO_GITHUB_MIN_WRITE_INTERVAL:-1s}
      SEISMO_GITHUB_MAX_RATE_LIMIT_WAIT: ${SEISMO_GITHUB_MAX_RATE_LIMIT_WAIT:-30s}
      # GitLab and Bitbucket: deployment-wide instance settings only. Each
      # app registers its own OAuth application (client ID and secret)
      # through PUT /apps/{appID}/providers/{tracker}/credentials instead
      # of one shared here. Tokens and app client secrets are stored
      # encrypted with this key (empty in development = a fixed
      # development key).
      SEISMO_SECRETS_ENCRYPTION_KEY: ${SEISMO_SECRETS_ENCRYPTION_KEY:-}
      SEISMO_GITLAB_WEB_URL: ${SEISMO_GITLAB_WEB_URL:-}
      SEISMO_GITLAB_API_URL: ${SEISMO_GITLAB_API_URL:-}
      SEISMO_GITLAB_MAX_RATE_LIMIT_WAIT: ${SEISMO_GITLAB_MAX_RATE_LIMIT_WAIT:-30s}
      SEISMO_BITBUCKET_WEB_URL: ${SEISMO_BITBUCKET_WEB_URL:-}
      SEISMO_BITBUCKET_API_URL: ${SEISMO_BITBUCKET_API_URL:-}
      SEISMO_BITBUCKET_MAX_RATE_LIMIT_WAIT: ${SEISMO_BITBUCKET_MAX_RATE_LIMIT_WAIT:-30s}
      SEISMO_LIMITS_TEST_ISSUES_PER_MINUTE: ${SEISMO_LIMITS_TEST_ISSUES_PER_MINUTE:-10}
      # Log coordinator (see backend/docs/coordinator.md)
      SEISMO_COORDINATOR_ENABLED: "true"
      SEISMO_COORDINATOR_ADDR: ":9443"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  postgres-data:
  nats-data:
