# Local development stack: `docker compose -f deploy/compose.yaml up -d`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mseismo
      POSTGRES_PASSWORD: mseismo
      POSTGRES_DB: mseismo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mseismo -d mseismo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
