name: m_seismo
description: Flutter bridge for the native m-Seismo iOS and Android SDKs.
version: 0.1.0
homepage: https://github.com/MicroClub-USTHB/m-Seismo
repository: https://github.com/MicroClub-USTHB/m-Seismo
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: 25.3.0

flutter:
  plugin:
    platforms:
      android:
        package: org.microclub.mseismo
        pluginClass: MSeismoPlugin
      ios:
        pluginClass: MSeismoPlugin
