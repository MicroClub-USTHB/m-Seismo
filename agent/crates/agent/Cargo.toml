[package]
name = "seismo-agent"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hostname = "0.4.2"
seismo-proto.workspace = true
prost-types = "0.14.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
futures-util = "0.3.34"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util"] }
tokio-stream = "0.1.19"
tonic.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
